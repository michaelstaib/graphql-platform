    type: Operation
    schema: a
    operation: |
      query Op_123456789101112_1($v: Boolean!) {
        shelf {
          top {
            ... @include(if: $v) {
              ... {
                id
              }
            }
          }
          sid
        }
      }
    forwardedVariables:
