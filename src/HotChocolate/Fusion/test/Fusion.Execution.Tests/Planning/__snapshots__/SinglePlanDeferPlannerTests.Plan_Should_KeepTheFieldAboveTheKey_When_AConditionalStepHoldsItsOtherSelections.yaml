operation:
  - document: |
      query($v: Boolean!) {
        shelf {
          top {
            ... @include(if: $v) {
              upc
              name
              ... @defer(label: "x", __group: 0, __parent: -1) {
                price
                upc @fusion__requirement
                id @fusion__requirement
              }
            }
          }
          sid @fusion__requirement
        }
      }
    hash: 123456789101112
    searchSpace: 3
    expandedNodes: 4
nodes:
